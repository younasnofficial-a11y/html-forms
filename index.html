<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>

    <h1>HTML Form</h1>

    <form action="">
 <h2>Bio Data</h2>

  <p>name: * <input type="text" name="name" required></p>
  <p> password: * <input type="password" name="password" required></p>
  <p>DOB: <input type="date" name="DOB"></p>
  <br>
  <img src="./2pic.jpeg" alt="my picture" width="250">
  <br><br>
 <fieldset>
    <legend>gender</legend>
  <p>male: <input type="radio" name="gender"> female: <input type="radio" name="gender"></p>
 </fieldset>
 <br><br>

     <label for="Nationality">Nationality:</label>
<select name="Nationality" id="Nationality">
    <option value="">--select your contry--</option>
    <option value="america">america</option>
    <option value="pakistan">pakistan</option>
    <option value="dubai">dubai</option>
    <option value="lodon">lodon</option>
    <option value="chaina">chaina</option>
    <option value="turki">turki</option>
</select>
<br><br>
   <label for="city">City:</label>
<select id="city" name="city">
    <option value="">Select City</option>
    <option value="karachi">Karachi</option>
    <option value="lahore">Lahore</option>
    <option value="islamabad">Islamabad</option>
    <option value="peshawar">Peshawar</option>
    <option value="quetta">Quetta</option>
</select>
<br><br>
<h2>Professional Experience</h2>

<label for="experience">Total Professional Experience:</label>
<input type="number" id="experience" name="experience" min="5">
<br><br>

<label for="qualification">Qualification:</label>
<select id="qualification" name="qualification">
    <option value="">Select Qualification</option>
    <option value="matric">Matric</option>
    <option value="intermediate">Intermediate</option>
    <option value="graduation">Graduation</option>
    <option value="masters">Masters</option>
</select>
<br><br>
<h2>Other Details</h2>

<label for="subjects">Favourite Subjects:</label>
<select id="subjects" name="subjects" multiple>
    <option value="html">HTML</option>
    <option value="css">CSS</option>
    <option value="javascript">JavaScript</option>
    <option value="computer-science">Computer Science</option>
    <option value="mathematics">Mathematics</option>
</select>
<br><br>
<input type="submit" value="Submit">

</form>

</body>
</html>
